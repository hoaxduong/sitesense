[project]
name = "sitesense-api"
version = "0.1.0"
description = "SiteSense API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitesense_api"]

[tool.uv]
required-version = ">=0.12.23"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
