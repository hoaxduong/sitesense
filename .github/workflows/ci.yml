name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Python lockfile
        run: uv lock --check --project apps/api

      - name: Install Python dependencies
        run: uv sync --frozen --project apps/api

      - name: Check formatting, lint, types, tests, and builds
        run: pnpm check

      - name: Smoke test production frontend and API
        run: pnpm smoke

      - name: Verify generated API contract
        run: |
          pnpm generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts
