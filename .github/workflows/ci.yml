name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate Python app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lockfile
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check lint, formatting, types, tests, and package builds
        run: uv run --frozen python scripts/check.py

      - name: Smoke test Streamlit startup and rendering
        run: uv run --frozen python scripts/smoke.py
