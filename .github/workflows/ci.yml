name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate Python app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sitesense_ci
          POSTGRES_USER: sitesense_ci
          POSTGRES_PASSWORD: sitesense_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sitesense_ci -d sitesense_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lockfile
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check lint, formatting, types, tests, and package builds
        run: uv run --frozen python scripts/check.py

      - name: Smoke test Streamlit startup and rendering
        run: uv run --frozen python scripts/smoke.py

      - name: Test PostgreSQL migrations, imports, and persistence
        env:
          TEST_DATABASE_URL: postgresql://sitesense_ci:sitesense_ci_only@127.0.0.1:5432/sitesense_ci
        run: uv run --frozen pytest tests/test_database.py tests/test_import_data.py
