name: sitesense

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitesense}
      POSTGRES_USER: ${POSTGRES_USER:-sitesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set a local password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
