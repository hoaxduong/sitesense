[project]
name = "sitesense"
version = "0.1.0"
description = "Streamlit research workspace for weather-aware retail location assessment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "streamlit>=1.54,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pandas-stubs>=3.0,<4",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
notebooks = [
    "catboost>=1.2,<2",
    "gdown>=5.2,<7",
    "ipykernel>=6.29,<8",
    "joblib>=1.4,<2",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "numpy>=2,<3",
    "omfiles==1.2.0",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "threadpoolctl>=3.6,<4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitesense"]

[tool.hatch.build.targets.sdist]
include = ["src/sitesense", "app.py", ".streamlit/config.toml", "pyproject.toml", "README.md"]

[tool.uv]
required-version = ">=0.12.23"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
